# Temporary Android quality gate (Android branch only). Runs ONLY when this file changes on the Android branch.
# rev: 12  (bump this number to re-run after editing android/ci/emulator-verify.mjs)
# No secrets, no signing, no publishing, no schedule. Read-only token. Evidence is uploaded as a 7-day artifact.
name: android-emulator-verify
on:
  push:
    branches: [feature/cuescore-android-v1]
    paths: ['.github/workflows/android-emulator-verify.yml']
permissions:
  contents: read
concurrency:
  group: android-emulator-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      # CI-only: allow WebView remote debugging in the generated asset so the test driver can operate the UI.
      # The committed capacitor.config.json (product config) is NOT changed.
      - run: |
          sed -i 's/"webContentsDebuggingEnabled": false/"webContentsDebuggingEnabled": true/' android/app/src/main/assets/capacitor.config.json
          grep -n webContentsDebuggingEnabled android/app/src/main/assets/capacitor.config.json
      - run: cd android && ./gradlew :app:assembleDebug --no-daemon
      - run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-apk-ci
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 35, target: google_apis, label: api35 }
          - { api: 36, target: google_apis, label: api36 }
          - { api: 26, target: default, label: api26 }
          - { api: 35, target: google_apis, label: api35-16k }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: debug-apk-ci, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Prepare 16 KB page-size AVD
        if: matrix.label == 'api35-16k'
        run: |
          SM=$ANDROID_HOME/cmdline-tools/latest/bin
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME
          yes | $SM/sdkmanager --licenses > /dev/null || true
          $SM/sdkmanager --install 'system-images;android-35;google_apis_ps16k;x86_64' > /dev/null
          echo no | $SM/avdmanager create avd --force -n ps16k -k 'system-images;android-35;google_apis_ps16k;x86_64' -d pixel_6
          $SM/avdmanager list avd | head -12
          grep -E 'image.sysdir|tag.id|abi.type' ~/.android/avd/ps16k.avd/config.ini
      - name: Run emulator verification
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          avd-name: ${{ matrix.label == 'api35-16k' && 'ps16k' || 'test' }}
          force-avd-creation: ${{ matrix.label != 'api35-16k' }}
          script: node android/ci/emulator-verify.mjs apk/app-debug.apk out-${{ matrix.label }} ${{ matrix.label }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: emulator-evidence-${{ matrix.label }}
          path: out-${{ matrix.label }}
          retention-days: 7
          if-no-files-found: warn
