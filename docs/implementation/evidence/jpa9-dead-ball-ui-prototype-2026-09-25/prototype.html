<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CueScore JPA 9-Ball Dead Ball UI Prototype</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f6f4;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",sans-serif}
    button{font:inherit}
    .screen{width:390px;height:844px;margin:0;display:flex;flex-direction:column;background:#f6f6f4;overflow:hidden}
    header{height:66px;display:grid;grid-template-columns:54px 1fr 88px;align-items:end;padding:8px 16px 9px;background:#fff}
    .back{border:0;background:transparent;font-size:34px;line-height:34px;text-align:left;padding:0 0 2px}
    .title{display:flex;align-items:center;justify-content:center;gap:7px;font-size:21px;font-weight:780;white-space:nowrap}
    .title img{width:29px;height:29px}
    .time{font-size:11px;font-weight:650;text-align:right;padding-bottom:6px}
    main{flex:1;min-height:0;display:grid;grid-template-rows:auto 34px minmax(104px,1fr) auto;gap:7px;padding:6px 14px 9px}
    .scoreboard{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .player{height:111px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #dededb;border-radius:12px;background:#fff;box-shadow:0 7px 22px rgba(0,0,0,.035)}
    .player.active{border:2px solid #f4b400;background:#fffaf0;color:#8b6200}
    .name{font-size:14px;font-weight:690}.score{font-size:54px;font-weight:820;line-height:1;margin:2px 0}.goal{font-size:11px;font-weight:650}
    .turn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#f6f6f4;color:#f4b400;font-size:22px;font-weight:800}
    .status{display:grid;grid-template-columns:repeat(3,1fr);align-items:center;border:1px solid #e0e0dc;border-radius:10px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.035);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
    .status span{position:relative;text-align:center}.status span+span:before{content:"";position:absolute;left:0;top:2px;width:1px;height:14px;background:#dededb}.status b{font-size:15px;margin-left:5px}
    .status .dead b{color:#8b6200}
    .history{min-height:0;overflow:hidden;border-radius:13px;background:#fff;box-shadow:0 7px 24px rgba(0,0,0,.05);padding:8px 12px}
    .rack{display:flex;align-items:center;gap:7px;color:#9a9a96;font-size:10px;font-weight:650}.rack:before,.rack:after{content:"";height:1px;flex:1;background:#e4e4e1}
    .row{min-height:39px;display:grid;grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr);align-items:center;border-bottom:1px solid #efefed}
    .inning{text-align:center;font-size:13px;font-weight:750;color:#70706d}.events{display:flex;align-items:center;gap:5px;min-width:0}.events.right{justify-content:flex-end}
    .symbol{width:22px;height:22px;display:grid;place-items:center;border:1px solid #dededb;border-radius:6px;background:#f4f4f2;font-size:12px;font-weight:800}.symbol.f{color:#c1121f}.symbol.b{color:#8b6200}
    .ball{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--ball,#d09b00);background:#fff;color:#111;font-size:9.5px;font-weight:850;box-shadow:none}
    .ball.used{border-color:#b8b8b5;background:#f3f3f1;color:#858582;opacity:1;filter:none;box-shadow:none}
    .play{display:grid;gap:7px}
    .balls{display:grid;grid-template-columns:repeat(5,40px);grid-auto-rows:40px;justify-content:center;gap:6px 12px;padding:8px 11px;border:1px solid #dededb;border-radius:14px;background:#fff}
    .game-ball{width:40px;height:40px;border-radius:50%;border:2px solid var(--ball,#d09b00);background:#fff;font-size:18px;font-weight:820}.game-ball.stripe{background:linear-gradient(#fff 0 27%,var(--ball) 27% 73%,#fff 73%)}
    .actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.action{min-height:58px;border:1px solid #ececea;border-radius:12px;background:#fff;font-size:9px;font-weight:700;color:#555553;display:grid;place-items:center;padding:6px 2px}.action strong{font-size:20px;line-height:1}.action.foul{color:#c1121f}.action.switch{color:#171717}
    .prototype{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.12em;color:#999;z-index:2}
  </style>
</head>
<body>
  <div class="screen">
    <div class="prototype">PROTOTYPE</div>
    <header><button class="back" aria-label="戻る">‹</button><div class="title"><img src="../../../../assets/icons/games/game-jpa-9ball.svg" alt=""><span>JPA 9-Ball</span></div><div class="time">開始時刻 16:37</div></header>
    <main>
      <section class="scoreboard"><div class="player active"><div class="name">はると</div><div class="score" id="score1">0</div><div class="goal">Race to 38</div></div><div class="player"><div class="name">あおい</div><div class="score">0</div><div class="goal">Race to 31</div></div><div class="turn">←</div></section>
      <section class="status" aria-label="試合状況"><span>ラック<b>1</b></span><span>イニング<b>1</b></span><span class="dead">デッド<b id="deadCount">0</b></span></section>
      <section class="history"><div class="rack">Rack 1</div><div class="row"><div class="events" id="events"></div><div class="inning">1</div><div class="events right"></div></div><div class="row"><div class="events"></div><div class="inning">2</div><div class="events right"></div></div></section>
      <section class="play"><div class="balls" id="balls"></div><div class="actions"><button class="action"><strong>◉̸</strong><span>デッド</span></button><button class="action"><strong>♢</strong><span>セーフティ</span></button><button class="action foul"><strong>△</strong><span>ファール</span></button><button class="action switch"><strong>⇄</strong><span>交代</span></button><button class="action switch"><strong>↶</strong><span>Undo</span></button></div></section>
    </main>
  </div>
  <script>
    const colors={1:"#d9a400",2:"#2356b8",3:"#c92a2a",4:"#8d4bb8",5:"#e56b1f",6:"#318e4d",7:"#7c542f",8:"#171717",9:"#d9a400"};
    const ball=n=>`<span class="ball" style="--ball:${colors[n]}">${n}</span>`;
    const existingDead=n=>`<span class="ball used" style="--ball:${colors[n]}" aria-label="${n}番 Dead Ball">${n}</span>`;
    const symbol=(value,kind=value.toLowerCase())=>`<span class="symbol ${kind}">${value}</span>`;
    const states={
      normalScore:{count:0,score:1,events:`${ball(3)}`},
      deadBall:{count:1,score:0,events:`${existingDead(3)}`},
      breakScratch:{count:1,score:0,events:`${symbol("B","b")}${existingDead(3)}${symbol("F","f")}${symbol("/","")}`},
      foulPocket:{count:1,score:0,events:`${existingDead(3)}${symbol("F","f")}`},
      dead0:{count:0,score:0,events:`${symbol("B","b")}${symbol("F","f")}${symbol("/","")}`},
      multiple:{count:3,score:1,events:`${existingDead(2)}${existingDead(4)}${existingDead(6)}`}
    };
    const key=new URLSearchParams(location.search).get("state")||"normalScore";
    const state=states[key]||states.normalScore;
    document.getElementById("deadCount").textContent=state.count;
    document.getElementById("score1").textContent=state.score;
    document.getElementById("events").innerHTML=state.events;
    const used=new Set(key==="multiple"?[2,4,6]:key==="dead0"?[]:[3]);
    document.getElementById("balls").innerHTML=Array.from({length:9},(_,i)=>{const n=i+1;return `<button class="game-ball ${n===9?"stripe":""}" style="--ball:${colors[n]};${used.has(n)?"opacity:.34":""}" ${used.has(n)?"disabled":""}>${n}</button>`}).join("");
  </script>
</body>
</html>
