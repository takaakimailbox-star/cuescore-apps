<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>JPA 9-Ball Dead Ball UI Prototype</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:#ececeb;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#111}
    main{width:1200px;padding:28px 20px 36px}h1{margin:0 0 4px;font-size:25px;text-align:center}p{margin:0 0 20px;text-align:center;color:#60605d;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{margin:0;background:#fff;border:1px solid #d8d8d5;border-radius:18px;padding:10px 10px 14px;box-shadow:0 3px 12px #00000010}.card img{display:block;width:100%;height:auto;border-radius:11px;border:1px solid #ddd}.card figcaption{text-align:center;font-size:16px;font-weight:800;margin-top:10px}.card small{display:block;text-align:center;color:#777;margin-top:4px;font-size:12px}
  </style>
</head>
<body>
  <main>
    <h1>JPA 9-Ball — Dead Ball UI Prototype</h1>
    <p>Product Owner final correction / 390×844 / 現行通常Dead表示を統一使用 / 製品実装未着手</p>
    <section class="grid">
      <figure class="card"><img src="01_normal_scoring_ball_390x844.png"><figcaption>通常得点球</figcaption><small>③ / 通常opacity 1.00</small></figure>
      <figure class="card"><img src="02_dead_ball_390x844.png"><figcaption>現行の通常Dead球</figcaption><small>既存state=&quot;used&quot;</small></figure>
      <figure class="card"><img src="03_break_scratch_dead_ball_390x844.png"><figcaption>Break Scratch + Dead</figcaption><small>B　③　F /・同じ既存Dead表示</small></figure>
      <figure class="card"><img src="04_normal_foul_dead_ball_390x844.png"><figcaption>通常Foul + Dead</figcaption><small>③　F・同じ既存Dead表示</small></figure>
      <figure class="card"><img src="05_dead_0_390x844.png"><figcaption>Dead 0</figcaption><small>B　F /</small></figure>
      <figure class="card"><img src="06_multiple_dead_390x844.png"><figcaption>複数Dead</figcaption><small>累計3</small></figure>
    </section>
  </main>
</body>
</html>
